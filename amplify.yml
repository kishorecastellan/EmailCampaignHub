version: 1
backend:
  phases:
    build:
      commands:
        # Reuse Amplify-restored node_modules + local npm cache when present.
        # Prefer incremental npm install over npm ci (ci deletes node_modules every run).
        - |
          if [ -d node_modules ]; then
            echo "Using cached node_modules — incremental install"
            npm install --cache .npm --prefer-offline --no-audit --no-fund
          else
            echo "Cold cache — clean install"
            npm ci --cache .npm --prefer-offline --no-audit --no-fund
          fi
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        # Dependencies already installed in backend phase; do not reinstall.
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      # npm download cache (speeds prefer-offline installs)
      - .npm/**/*
      # restored on next build so install can be incremental
      - node_modules/**/*
      # Next.js compile / webpack / turbopack cache
      - .next/cache/**/*
